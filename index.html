<body data-tool="fraction-calc">
<main class="s3-main">
  <section class="s3-hero">
    <h1>Fraction Calc</h1>
    <p>Exact fraction arithmetic with every step shown. Mixed numbers, repeating decimals and huge numbers are handled without rounding.</p>
  </section>

  <div class="seg fc-tabs" id="tabs" role="tablist" aria-label="Mode">
    <button type="button" data-v="calc" aria-pressed="true">Calculate</button>
    <button type="button" data-v="d2f" aria-pressed="false">Decimal → fraction</button>
    <button type="button" data-v="f2d" aria-pressed="false">Fraction → decimal</button>
    <button type="button" data-v="cmp" aria-pressed="false">Compare</button>
  </div>

  <section class="card stack mt fc-panel" data-panel="calc">
    <label class="field" for="calcIn">Expression</label>
    <input class="input fc-in" id="calcIn" dir="ltr" autocomplete="off" spellcheck="false" placeholder="1 1/2 + 3/4 × 2/5">
    <div class="row fc-keys" id="calcKeys">
      <button class="btn small" type="button" data-ins=" + ">+</button>
      <button class="btn small" type="button" data-ins=" − ">−</button>
      <button class="btn small" type="button" data-ins=" × ">×</button>
      <button class="btn small" type="button" data-ins=" ÷ ">÷</button>
      <button class="btn small" type="button" data-ins="(">(</button>
      <button class="btn small" type="button" data-ins=")">)</button>
      <button class="btn small" type="button" data-ins="^">^</button>
      <span class="faint">Mixed number: <code>2 3/4</code> · repeating decimal: <code>0.(3)</code></span>
    </div>
  </section>

  <section class="card stack mt fc-panel" data-panel="d2f" hidden>
    <label class="field" for="decIn"><span>Decimal <span class="faint">(put the repeating part in brackets: 0.(3), 1.2(34))</span></span></label>
    <input class="input fc-in" id="decIn" dir="ltr" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="0.1(6)">
  </section>

  <section class="card stack mt fc-panel" data-panel="f2d" hidden>
    <label class="field" for="fracIn">Fraction or mixed number</label>
    <input class="input fc-in" id="fracIn" dir="ltr" autocomplete="off" spellcheck="false" placeholder="5/7">
  </section>

  <section class="card stack mt fc-panel" data-panel="cmp" hidden>
    <label class="field" for="cmpIn"><span>Fractions to compare <span class="faint">(separate with commas)</span></span></label>
    <input class="input fc-in" id="cmpIn" dir="ltr" autocomplete="off" spellcheck="false" placeholder="2/3, 3/5, 7/10">
  </section>

  <div class="fc-grid mt">
    <section class="card">
      <div class="row between">
        <h2>Result</h2>
        <button class="btn ghost small" type="button" id="copy"><svg class="i"><use href="#i-copy"/></svg>Copy</button>
      </div>
      <div id="result" class="fc-result" aria-live="polite"></div>
    </section>
    <section class="card">
      <h2>Working</h2>
      <ol id="steps" class="fc-steps"></ol>
    </section>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
